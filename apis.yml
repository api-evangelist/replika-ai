- type: Features
  data:
  - AI companion chatbot with persistent personality and memory
  - Customizable avatar, personality, and voice
  - Voice calls with the Replika
  - Selfies and image-sharing inside chat
  - Augmented reality and VR (Oculus Rift) modes
  - Tiered relationship modes - free friend, paid partner/spouse/sibling/mentor
  - Freemium model (Replika Pro subscription)
  - iOS, Android, and web (my.replika.com) availability
  - 40+ million users worldwide (as of 2025)
  - Founded by Eugenia Kuyda at Luka, Inc. (Nov 2017); Dmytro Klochko CEO from 2025
